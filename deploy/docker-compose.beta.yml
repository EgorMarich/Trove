services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - trove_beta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - trove_beta_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ../backend/db/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        psql "postgresql://$$POSTGRES_USER@postgres:5432/$$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now());"
        for file in /migrations/*.sql; do
          version="$$(basename "$$file")"
          if psql "postgresql://$$POSTGRES_USER@postgres:5432/$$POSTGRES_DB" -tAc "SELECT 1 FROM schema_migrations WHERE version='$$version'" | grep -q 1; then continue; fi
          echo "Applying $$version"
          psql "postgresql://$$POSTGRES_USER@postgres:5432/$$POSTGRES_DB" -v ON_ERROR_STOP=1 -f "$$file"
          psql "postgresql://$$POSTGRES_USER@postgres:5432/$$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations(version) VALUES ('$$version') ON CONFLICT DO NOTHING;"
        done
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
    environment:
      NODE_ENV: beta
      PORT: 3001
      HOST: 0.0.0.0
      FRONTEND_ORIGIN: ${TROVE_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      DATABASE_SSL_REQUIRED: "false"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-trove-beta:}
      PAYMENT_PROVIDER: mock-payment
      MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:?set MOCK_PAYMENT_WEBHOOK_SECRET}
      BOOKING_API_BASE_URL: ${BOOKING_API_BASE_URL:-https://demandapi-sandbox.booking.com/3.2}
      BOOKING_API_KEY: ${BOOKING_API_KEY:-}
      BOOKING_AFFILIATE_ID: ${BOOKING_AFFILIATE_ID:-}
      BOOKING_BOOKER_COUNTRY: ${BOOKING_BOOKER_COUNTRY:-ru}
      BOOKING_CURRENCY: ${BOOKING_CURRENCY:-EUR}
      BOOKING_DEFAULT_CITY_ID: ${BOOKING_DEFAULT_CITY_ID:-}
      BOOKING_CITY_MAP_JSON: ${BOOKING_CITY_MAP_JSON:-{}}
      BOOKING_NATIVE_BOOKING_ENABLED: ${BOOKING_NATIVE_BOOKING_ENABLED:-false}
      BOOKING_PAYMENT_TIMING: ${BOOKING_PAYMENT_TIMING:-pay_at_property}
      BOOKING_PAYMENT_METHOD: ${BOOKING_PAYMENT_METHOD:-pay_at_property}
      RECONCILIATION_WORKER_ENABLED: ${RECONCILIATION_WORKER_ENABLED:-true}
      RECONCILIATION_INTERVAL_MS: ${RECONCILIATION_INTERVAL_MS:-5000}
      RECONCILIATION_BATCH_SIZE: ${RECONCILIATION_BATCH_SIZE:-20}
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:?set OPS_METRICS_TOKEN}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../frontend
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_PUBLIC_USE_DEMO_FALLBACK: "false"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  trove_beta_postgres_data:
  trove_beta_redis_data:
