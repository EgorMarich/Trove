services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - trove_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - trove_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ../backend/db/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        psql "postgresql://$$POSTGRES_USER@postgres:5432/$$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now());"
        for file in /migrations/*.sql; do
          version="$$(basename "$$file")"
          if psql "postgresql://$$POSTGRES_USER@postgres:5432/$$POSTGRES_DB" -tAc "SELECT 1 FROM schema_migrations WHERE version='$$version'" | grep -q 1; then
            echo "Skipping $$version (already applied)"
            continue
          fi
          echo "Applying $$version"
          psql "postgresql://$$POSTGRES_USER@postgres:5432/$$POSTGRES_DB" -v ON_ERROR_STOP=1 -f "$$file"
          psql "postgresql://$$POSTGRES_USER@postgres:5432/$$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations(version) VALUES ('$$version') ON CONFLICT DO NOTHING;"
        done
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      FRONTEND_ORIGIN: ${TROVE_ORIGIN:?set TROVE_ORIGIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      DATABASE_SSL_REQUIRED: "false"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-trove:}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?set PAYMENT_PROVIDER}
      YOOKASSA_API_URL: ${YOOKASSA_API_URL:-https://api.yookassa.ru/v3}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-}
      MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:-}
      BOOKING_API_BASE_URL: ${BOOKING_API_BASE_URL:-https://demandapi-sandbox.booking.com/3.2}
      BOOKING_API_KEY: ${BOOKING_API_KEY:-}
      BOOKING_AFFILIATE_ID: ${BOOKING_AFFILIATE_ID:-}
      BOOKING_BOOKER_COUNTRY: ${BOOKING_BOOKER_COUNTRY:-ru}
      BOOKING_CURRENCY: ${BOOKING_CURRENCY:-EUR}
      BOOKING_DEFAULT_CITY_ID: ${BOOKING_DEFAULT_CITY_ID:-}
      BOOKING_CITY_MAP_JSON: ${BOOKING_CITY_MAP_JSON:-{}}
      BOOKING_NATIVE_BOOKING_ENABLED: ${BOOKING_NATIVE_BOOKING_ENABLED:-false}
      BOOKING_PAYMENT_TIMING: ${BOOKING_PAYMENT_TIMING:-pay_at_property}
      BOOKING_PAYMENT_METHOD: ${BOOKING_PAYMENT_METHOD:-pay_at_property}
      RECONCILIATION_WORKER_ENABLED: ${RECONCILIATION_WORKER_ENABLED:-true}
      RECONCILIATION_INTERVAL_MS: ${RECONCILIATION_INTERVAL_MS:-30000}
      RECONCILIATION_BATCH_SIZE: ${RECONCILIATION_BATCH_SIZE:-20}
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:?set OPS_METRICS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: /api
      NUXT_PUBLIC_SITE_URL: https://${TROVE_DOMAIN:?set TROVE_DOMAIN}
      NUXT_PUBLIC_USE_DEMO_FALLBACK: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TROVE_DOMAIN: ${TROVE_DOMAIN:?set TROVE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - trove_caddy_data:/data
      - trove_caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  trove_postgres_data:
  trove_redis_data:
  trove_caddy_data:
  trove_caddy_config:
