services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trove
      POSTGRES_USER: trove
      POSTGRES_PASSWORD: trove_dev_password
    ports:
      - '5432:5432'
    volumes:
      - trove_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - trove_redis_data:/data

volumes:
  trove_postgres_data:
  trove_redis_data:
